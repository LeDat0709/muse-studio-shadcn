name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Start the packaged app once (--smoke-test)
        shell: pwsh
        timeout-minutes: 5
        env:
          MUSE_PORT: "18730"
          CDP_PORT: "9399"
          PORTABLE_EXECUTABLE_DIR: ${{ runner.temp }}
        run: |
          $p = Start-Process "dist/win-unpacked/Muse AI Studio.exe" -ArgumentList "--smoke-test" -Wait -PassThru `
            -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path smoke.txt -Pattern '"smoke":"ok"' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Muse-AI-Studio-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach the exe to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes
